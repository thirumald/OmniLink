connector_id: pump-station-7
type: modbus
tenant: abudhabi
poll_interval_s: 5
settings: { host: 10.30.7.20, port: 502, unit_id: 1 }
points:
  - { point_ref: "hr:100:float32", device_id: pump-1, entity_type: WaterPump, attribute: flowRate, unit: L/s, source_unit: gal/min }
  - { point_ref: "ir:200:uint16", device_id: pump-1, entity_type: WaterPump, attribute: pressure, unit: kPa, scale: 0.1 }
  - { point_ref: "co:1:bool", device_id: pump-1, entity_type: WaterPump, attribute: running }
