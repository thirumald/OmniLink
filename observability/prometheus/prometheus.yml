# Docker Compose scrape config. Kubernetes uses observability/prometheus/prometheus-k8s.yml (pod discovery).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { platform: omnilink }

rule_files: [/etc/prometheus/rules.yml]

remote_write:
  - url: http://victoriametrics:8428/api/v1/write

scrape_configs:
  - job_name: omnilink-services
    static_configs:
      - targets: ["asset-registry:8001", "alarm-service:8002", "command-service:8003", "query-api:8004",
                  "outbound:8005", "http-ingest:8010", "assistant:8020"]
  - job_name: omnilink-connectors        # connectors expose :9108; add one target per connector container
    static_configs:
      - targets: ["connector-aq:9108", "connector-modbus-sim:9108"]
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs: [{ targets: ["apisix:9091"] }]
  - job_name: rabbitmq
    static_configs: [{ targets: ["rabbitmq:15692"] }]
