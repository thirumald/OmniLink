global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels: { platform: omnilink }

rule_files: [/etc/prometheus/rules.yml]

alerting:
  alertmanagers: [{ static_configs: [{ targets: ["alertmanager:9093"] }] }]

remote_write:
  - url: http://victoriametrics:8428/api/v1/write

scrape_configs:
  - job_name: omnilink-services
    metrics_path: /metrics
    static_configs:
      - targets: ["asset-registry:8001", "alarm-service:8002", "command-service:8003", "query-api:8004",
                  "outbound:8005", "http-ingest:8010", "assistant:8020"]
  - job_name: omnilink-connectors
    kubernetes_sd_configs: [{ role: pod }]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: "true"
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
  - job_name: kafka
    static_configs: [{ targets: ["kafka-exporter:9308"] }]
  - job_name: clickhouse
    static_configs: [{ targets: ["clickhouse:9363"] }]
  - job_name: apisix
    metrics_path: /apisix/prometheus/metrics
    static_configs: [{ targets: ["apisix:9091"] }]
  - job_name: temporal
    static_configs: [{ targets: ["temporal:9090"] }]
