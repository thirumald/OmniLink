# NanoMQ edge broker (HOCON). Local devices + edge flows connect on 1883 inside the OT VLAN.
mqtt { max_packet_size = 1MB }

listeners.tcp { bind = "0.0.0.0:1883" }

# Bridge local device topics to the core broker for anything not produced by OmniLink connectors
bridges.mqtt.core {
  server = "mqtt-tls://core-mqtt.omnilink.example:8883"
  proto_ver = 5
  clientid = "gw-abudhabi-site01"
  keepalive = 30s
  ssl {
    keyfile = "/etc/omnilink/certs/gateway.key"
    certfile = "/etc/omnilink/certs/gateway.crt"
    cacertfile = "/etc/omnilink/certs/ca.crt"
    verify_peer = true
  }
  forwards = [ { remote_topic = "omnilink/v1/raw/${clientid}/#", local_topic = "field/#", qos = 1 } ]
  subscription = [ { remote_topic = "omnilink/v1/cmd/gw-abudhabi-site01/#", local_topic = "cmd/#", qos = 1 } ]
  max_parallel_processes = 4
  # offline cache: keep messages while the WAN is down
  resend_interval = 5000
}

# Disk-backed queue for bridged messages
sqlite { disk_cache_size = 1024000, mounted_file_path = "/var/lib/nanomq/" }
